<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking AI Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .main-panel { display: flex; gap: 20px; margin-bottom: 20px; }
        .video-box { flex: 2; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .video-box img { width: 100%; max-width: 640px; border-radius: 4px; border: 3px solid #34495e; }
        .status-box { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .status-badge { font-size: 24px; font-weight: bold; padding: 15px 30px; border-radius: 50px; text-align: center; margin-top: 15px; width: 80%; }
        .clear { background: #f1c40f; color: #2c3e50; }
        .authorized { background: #2ecc71; color: white; }
        .unauthorized { background: #e74c3c; color: white; }
        .log-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
    <script>
        // Automatically refresh data logs and status badges every 1 second
        setInterval(function() {
            fetch('/status_data')
                .then(response => response.json())
                .then(data => {
                    const badge = document.getElementById('status-badge');
                    badge.innerText = data.current_status;
                    badge.className = 'status-badge ' + data.status_class;
                    document.getElementById('scanned-plate').innerText = data.last_plate;
                    
                    let logHtml = '';
                    data.logs.forEach(log => {
                        logHtml += `<tr>
                            <td><strong>${log.timestamp}</strong></td>
                            <td>${log.plate}</td>
                            <td style="color: ${log.type === 'AUTHORIZED' ? 'green' : 'red'}; font-weight:bold;">${log.type}</td>
                            <td>${log.action}</td>
                        </tr>`;
                    });
                    document.getElementById('log-rows').innerHTML = logHtml;
                });
        }, 1000);
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 B.Tech Smart Automated Parking Management System</h1>
        </header>
        <div class="main-panel">
            <div class="video-box">
                <h3>📷 Live Edge Video Telemetry Feed</h3>
                <img src="{{ url_for('video_feed') }}" alt="Camera Stream Loading...">
            </div>
            <div class="status-box">
                <h3>🔍 Scanner Status Monitoring</h3>
                <p>Last Scanned Plate: <span id="scanned-plate" style="font-weight: bold; font-size: 20px; color:#2c3e50;">None</span></p>
                <div id="status-badge" class="status-badge clear">LANE CLEAR</div>
            </div>
        </div>
        <div class="log-panel">
            <h3>📋 Automated Access Logs (Entry / Exit Timeline)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>License Plate</th>
                        <th>Verification Status</th>
                        <th>Action Taken</th>
                    </tr>
                </thead>
                <tbody id="log-rows">
                    <!-- Dynamic Log rows injected here -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
